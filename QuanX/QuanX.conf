[general]
# > Internet 测试 URL
network_check_url = http://connectivitycheck.platform.hicloud.com/generate_204
# > 代理测速 URL
server_check_url = http://cp.cloudflare.com/generate_204
# > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
# > IP_API
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/phlinhng/QuantumultX/master/Scripts/IP_API.js
;geo_location_checker=disabled
# > 资源解析器
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# > 绕过处理
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# > dns_exclusion_list
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com, *.lan, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, stun.*, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.turn.twilio.com, *.stun.twilio.com, lancache.steamcontent.com
# > 当节点不支持UDP时，默认fallback 到reject
fallback_udp_policy = reject
# > UDP Drop名单
udp_drop_list=443

