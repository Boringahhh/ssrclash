# >> 订阅配置
proxy-providers:
  订阅1:
    type: http
    interval: 86400
    path: ./proxy_provider/Providers1.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com
      interval: 300
    proxy: 🎯 Direct
    url: "订阅链接1"
    override:
      # additional-prefix: "[机场名称1]"
      skip-cert-verify: true
      udp: true
  # 订阅2:
  #   type: http
  #   interval: 86400
  #   path: ./proxy_provider/Providers2.yaml
  #   health-check:
  #     enable: true
  #     url: http://cp.cloudflare.com
  #     interval: 300
  #   proxy: 🎯 Direct
  #   url: "订阅链接2"
  #   override:
  #     # additional-prefix: "[机场名称2]"
  #     skip-cert-verify: true
  #     udp: true

# 全局配置
mixed-port: 7890
# 局域网连接：允许其他设备经过本机代理
allow-lan: true
mode: rule
# 日志级别
log-level: warning
ipv6: false
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

# 外部控制(API) 如果使用的是裸核，需要将下面的注释#去掉，方便ui界面的使用
# external-controller: 0.0.0.0:9090
# external-ui: "./run/ui"
# external-ui-url: "https://gh-proxy.com/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# API 的访问密钥
# secret: "123456"

# 缓存
profile:
  store-selected: true
  store-fake-ip: true

# GEOIP 数据库
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# DNS配置
dns:
  enable: true
  prefer-h3: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - +.m2m
    - injections.adguard.org
    - local.adguard.org
    - +.bogon
    - +.local
    - +.lan
    - +.internal
    - +.localdomain
    - home.arpa
    - 127.0.0.1.sslip.io
    - 127.atlas.skk.moe
    - dns.msftncsi.com
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - xbox.*.microsoft.com
    - "*.xboxlive.com"
    - "*.turn.twilio.com"
    - "*.stun.twilio.com"
    - stun.syncthing.net
    - stun.*
    - 127.*.*.*.sslip.io
    - 127-*-*-*.sslip.io
    - "*.127.*.*.*.sslip.io"
    - "*-127-*-*-*.sslip.io"
    - 127.*.*.*.nip.io
    - 127-*-*-*.nip.io
    - "*.127.*.*.*.nip.io"
    - "*-127-*-*-*.nip.io"
  nameserver:
    # 公司等公共场合下，不建议使用system
    # - system
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

# 域名嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# Tunnel配置
tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true


proxies:
- name: "🎯 Direct"
  type: direct
  udp: true

# 策略组锚点
pr1: &pr1 {type: select, proxies: [🪁 Nodes, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 💠 Backup, 🇺🇳 Others, ✋ Manual, 🎯 Direct]}
pr2: &pr2 {type: select, proxies: [🎯 Direct, 🪁 Nodes, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 💠 Backup, 🇺🇳 Others, ✋ Manual]}

# 代理组锚点
UrlTest: &UrlTest {type: url-test, interval: 300, tolerance: 20, url: 'http://cp.cloudflare.com', disable-udp: false, timeout: 2000, max-failed-times: 3, lazy: true, include-all-providers: true}
FallBack: &FallBack {type: fallback, interval: 300, lazy: true, url: 'http://cp.cloudflare.com', disable-udp: false, timeout: 2000, max-failed-times: 3, include-all-providers: true}
LoadBalance: &LoadBalance {type: load-balance, interval: 300, lazy: true, url: 'http://cp.cloudflare.com', disable-udp: false, strategy: consistent-hashing, timeout: 2000, max-failed-times: 3, include-all-providers: true}

# 策略组
proxy-groups:
  - {name: 🪁 Nodes, type: select, proxies: [🔍︎ Auto, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 🇺🇳 Others, 💠 Backup, ✋ Manual, 🎯 Direct]}
  - {name: 🔍︎ Auto, <<: *UrlTest, proxies: [🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 💠 Backup, ✋ Manual]}
  - {name: 💾 Download, <<: *pr1}
  - {name: 💬 Telegram, <<: *pr1}
  - {name: 🎼 Spotify, type: select, proxies: [🪁 Nodes, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 🇹🇷 Turkey, 💠 Backup, 🇺🇳 Others, ✋ Manual, 🎯 Direct]}
  - {name: 🎮 Gaming, type: select, proxies: [🪁 Nodes, 🇭🇰 Hong Kong, 🇸🇬 Singapore, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇺🇸 USA, 🇹🇷 Turkey, 💠 Backup, 🇺🇳 Others, ✋ Manual, 🎯 Direct]}
  - {name: 📹 Global Media, <<: *pr1}
  - {name: 📹 HK&TW Media, <<: *pr2}
  - {name: 🎥 Emby, <<: *pr2}
  - {name: 🤖 AIGC, type: select, proxies: [🇺🇸 USA, 🇭🇰 Hong Kong, 🇨🇳 Taiwan, 🇯🇵 Japan, 🇪🇺 Europe, 🇺🇳 Others, 🪁 Nodes, ✋ Manual, 🎯 Direct]}
  - {name: 💾 Microsoft, <<: *pr2}
  - {name: 🍎 Apple, <<: *pr2}
  - {name: 🐟 Fallback, <<: *pr1}

  - {name: ✋ Manual, type: select, include-all: true}
  - {name: 🇭🇰 Hong Kong, <<: *UrlTest, filter: "(?i)^(?!.*备用)(?!.*(x0\\.01|x0\\.8)).*(🇭🇰|港|\\bHK\\b|\\bHKG\\b|Hong)"}
  - {name: 🇸🇬 Singapore, <<: *UrlTest, filter: "(?i)^(?!.*(x0\\.01|x0\\.8)).*(🇸🇬|新加坡|\\bSG\\b|Singapore)"}
  - {name: 🇨🇳 Taiwan, <<: *UrlTest, filter: "(?i)^(?!.*(x0\\.01|x0\\.8)).*(🇨🇳|台|\\bTW\\b|Taiwan)"}
  - {name: 🇯🇵 Japan, <<: *UrlTest, filter: "(?i)^(?!.*(x0\\.01|x0\\.8)).*(🇯🇵|日本|\\bJP\\b|Japan)"}
  - {name: 🇺🇸 USA, <<: *UrlTest, filter: "(?i)^(?!.*(x0\\.01|x0\\.8)).*(🇺🇸|美|\\bUSA?\\b|United\\sStates)"}
  - {name: 🇰🇷 Korea, <<: *UrlTest, filter: "(?i).*(🇰🇷|韩国|\\bKR\\b|Korea)"}
  - {name: 🇪🇺 Europe, type: select, include-all: true, filter: "(?i).*(🇩🇪|德国|\\bDE\\b|Germany|🇫🇷|法国|\\bFR\\b|France|🇮🇹|意大利|\\bIT\\b|Italy|🇪🇸|西班牙|\\bES\\b|Spain|🇬🇧|英国|\\bUK\\b|United\\sKingdom)"}
  - {name: 🇹🇷 Turkey, type: select, include-all: true, filter: "(?i).*(🇹🇷|土耳其|\\bTR\\b|\\bTUR\\b|Turkey)"}
  - {name: 🇺🇳 Others, type: select, include-all: true, filter: "^((?!(🇭🇰|🇸🇬|🇨🇳|🇯🇵|🇺🇸|DIRECT|🎯 Direct)).)*$"}
  - {name: 💠 Backup, <<: *UrlTest, filter: "(?=.*备用)"}
  - {name: 🛑 AdBlock, type: select, proxies: [REJECT, 🎯 Direct, 🪁 Nodes]}

## 规则组锚点
RuleSet_classical: &RuleSet_classical {type: http, behavior: classical, interval: 43200, format: text, proxy: 🪁 Nodes}
RuleSet_domain: &RuleSet_domain {type: http, behavior: domain, interval: 43200, format: text, proxy: 🪁 Nodes}
RuleSet_ipcidr: &RuleSet_ipcidr {type: http, behavior: ipcidr, interval: 43200, format: text, proxy: 🪁 Nodes}
ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

